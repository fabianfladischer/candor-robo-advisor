[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Projektmetadaten
# ---------------------------------------------------------------------------

[project]
name = "candor"
version = "0.1.0"
description = "CANDOR – regelbasierter Robo-Advisor mit zweiachsiger Geeignetheitsprüfung"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Fabian Fladischer" }]
keywords = ["robo-advisor", "mifid-ii", "geeignetheitspruefung", "portfoliooptimierung"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: German",
]

# Kein trainiertes Modell im Entscheidungspfad: scikit-learn ist ausschliesslich
# fuer den Ledoit-Wolf-Kovarianzschaetzer zugelassen.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "streamlit>=1.30",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    # Datenschicht: Parquet-Serialisierung des Snapshots und HTTP-Abruf.
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "pandas-stubs>=2.1",
    # Nur fuer den Golden-Master-Test: liest den Text aus den erzeugten PDFs
    # zurueck und belegt, dass der Satz den Inhalt vollstaendig uebernommen hat.
    "pypdf>=5.0",
]

[tool.setuptools.packages.find]
include = ["candor*"]

[tool.setuptools.package-data]
candor = ["py.typed", "report/templates/*"]

# ---------------------------------------------------------------------------
# ruff — Linting und Formatierung
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data", "figures"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "D",         # pydocstyle — Docstringpflicht
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations — Typannotationen erzwingen
    "S",         # flake8-bandit
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez — keine naiven Zeitstempel
    "T20",       # flake8-print — keine print-Aufrufe in der Bibliothek
    "PT",        # flake8-pytest-style
    "RET",       # flake8-return
    "SIM",       # flake8-simplify
    "ARG",       # flake8-unused-arguments
    "PTH",       # flake8-use-pathlib
    "PL",        # pylint
    "TRY",       # tryceratops
    "NPY",       # numpy-spezifisch, faengt u. a. legacy np.random ab
    "PD",        # pandas-vet
    "RUF",       # ruff-spezifisch
]
ignore = [
    "D206",   # Konflikt mit dem Formatter
    "W191",   # Konflikt mit dem Formatter
    "TRY003", # ausformulierte Fehlermeldungen sind hier erwuenscht (Prinzip P5)
]

# Deutsche Typografie ist in Docstrings und Kommentaren beabsichtigt. Ohne diese
# Liste meldet RUF001/RUF002 jeden Halbgeviertstrich und jedes typografische
# Anfuehrungszeichen als "ambiguous unicode character".
# Mathematische Zeichen kommen in den Herleitungen der Docstrings vor und sind
# dort beabsichtigt: Das Minuszeichen U+2212 ist in einer Formel richtiger als
# der Bindestrich.
# Das geschuetzte Leerzeichen U+00A0 ist der Tausendertrennzeichen-Kandidat
# nach DIN 5008 und in den Zahlausgaben beabsichtigt.
allowed-confusables = ["–", "„", "“", "”", "‚", "‘", "’", "−", "×", "\u00a0"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert ist in Tests das Ausdrucksmittel
    "PLR2004", # Vergleich gegen Literale ist in Tests beabsichtigt
    "ANN401",
]
"app/**/*.py" = ["T20"]
# Module mit Kommandozeilen-Einstiegspunkt: Ausgabe auf die Konsole ist dort
# ihr Zweck, nicht ein vergessener Debug-Aufruf.
"candor/data/snapshot.py" = ["T20"]
"candor/data/manifest.py" = ["T20"]
"candor/data/stats.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["candor"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strikte Typpruefung fuer candor/
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["candor"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

# Bibliotheken ohne ausgelieferte Typinformationen. Die Liste bleibt bewusst
# eng: jede Zeile ist eine bewusst in Kauf genommene Typluecke.
[[tool.mypy.overrides]]
module = ["reportlab.*", "sklearn.*", "scipy.*", "pypdfium2.*"]
ignore_missing_imports = true

# cvxpy liefert eine py.typed-Markierung aus, seine Annotationen sind aber
# unvollstaendig: Modulweite Funktionen wie `sum`, `quad_form` und `psd_wrap`
# fehlen darin, obwohl sie zur oeffentlichen Schnittstelle gehoeren. Weil das
# Paket als typisiert gilt, greift `ignore_missing_imports` nicht — noetig ist
# `follow_imports = "skip"`. Preis der Entscheidung: cvxpy ist fuer mypy `Any`.
# Deshalb wird der Rueckgabewert des Solvers in candor/portfolio/optimize.py
# unmittelbar per np.asarray in einen bekannten Typ ueberfuehrt, und das
# Ergebnis wird zusaetzlich zur Laufzeit gegen alle Restriktionen geprueft.
[[tool.mypy.overrides]]
module = ["cvxpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# reportlab liefert keine Typinformationen aus. In candor/report/document.py
# stammen deshalb Absatzformate, Flowables und die Zeichenflaeche als `Any` aus
# einem nicht verfolgten Import; `disallow_any_unimported` schlaegt dort
# zwangslaeufig an. Die Ausnahme ist auf dieses eine Modul begrenzt — es ist die
# einzige Stelle des Projekts, die reportlab unmittelbar benutzt. Der Inhalt der
# Dokumente entsteht davor im typisierten Zwischenmodell und wird als Text
# geprueft (tests/test_golden.py).
[[tool.mypy.overrides]]
module = ["candor.report.document"]
disallow_any_unimported = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "slow: laufzeitintensive Tests (z. B. 10 000 Simulationspfade)",
    "golden: Golden-Master-Tests gegen eingefrorene Referenzausgaben",
    "invariant: Eigenschaftsbasierte Tests der neun Invarianten",
    "netz: benoetigt Netzzugang (Live-Abruf); standardmaessig uebersprungen",
]

[tool.coverage.run]
source = ["candor"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
